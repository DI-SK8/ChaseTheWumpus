{% extends "base.html" %}
{% block title %}jeux{% endblock %}
{% block content %}
<table>
    {%for row in grid %}
        <tr>
            {%for col in row%}
                {%if col == 0%}
                    <td><img src="{{ url_for('static', filename='Asset/cave-removebg-preview.png') }}" height="70" width="70"/></td>
                {%elif col ==1%}
                    <td><img src="{{ url_for('static', filename='Asset/tunnel_1-removebg-preview.png') }}" height="70" width="70"/></td>
                {%else%}
                    <td><img src="{{ url_for('static', filename='Asset/tunnel_2-removebg-preview.png') }}" height="70" width="70"/></td>
                {%endif%}
            {%endfor%}
        </tr>
    {%endfor%}
</table>
{%endblock%}
