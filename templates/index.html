{% extends "base.html" %}
{% block title %}login{% endblock %}

{% block content %}
<div id="connexion">
    <form action="{{ url_for('login') }}" method="POST">
        <h1>connectez-vous</h1>
            <div>Nom</div>
            <input name="nom" id="nom" type="text"/>
            <div>Mots de passe</div>
            <input type="password" id="password" name="password">
            <input type="submit" value="Connexion" id="connexion_btn">
    </form>
    <a href="{{ url_for('SignIn') }}" id="sign_in">Créer un compte</a>
</div>
{% endblock %}
